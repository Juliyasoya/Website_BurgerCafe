<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "style.css" >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <nav class = "nav">
            <div class = "nav__logo">
                <img class = "nav__img" src = "image/icon.png" alt = "Логотип Vintage Food">
                <h1 class = "nav__name">Vintage Food</h1>
            </div>
            <div class = "nav__mainMenu">
                <ul class = "nav__list">
                    <li class = "nav__item">
                        <a class = "nav__link"href = "#main">Главная</a>
                    </li>
                    <li class = "nav__item">
                        <a class = "nav__link" href = "#stocks">Акции</a>
                    </li>
                    <li class = "nav__item">
                        <a class = "nav__link" href = "#aboutUs">О нас</a>
                    </li>
                    <li><img class="nav__imgBasket" src = "image/btnBasket.png" alt = "Изображение корзины заказа"></li>
                </ul>
            </div>
        </nav>

        <header class = "header">
            <div class = "header__slogan">
                <h4 class = "header__fastDelivery">Быстрая доставка для вас</h4>
                <p class = "header__discount">Сделай первый заказ и получи скидку 50%</p>
                <button class = "header__btnOrder">Заказать</button>
            </div>
            <img class = "header__imgBigBurger" src = "image/imgBurger.png" alt = "Изображение большого бургера">
        </header>

        <article class = "article">
            <h2 class = "article__tableName">Меню</h2>
            <div class = "article__table">
                <section class = "article__card">
                    <img class = "article__foodPhotos" src = "image/imgBurgers.png" alt = "Фото готового бургера из меню">
                    <h5 class = "article__menuCaption">Бургеры</h5>
                </section>
                <section class = "article__card">
                    <img class = "article__foodPhotos" src = "image/imgChickenButt.png" alt = "Фото готового бургера из меню">
                    <h5 class = "article__menuCaption">Блюда из курицы</h5>
                </section>
                <section class = "article__card">
                    <img class = "article__foodPhotos" src = "image/imgHotDishes.png" alt = "Фото готового бургера из меню">
                    <h5 class = "article__menuCaption">Горячие</h5>
                </section>
            </div>
                <div class = "article__table">
                <section class = "article__card">
                    <img class = "article__foodPhotos" src = "image/imgSnacks.png" alt = "Фото готового бургера из меню">
                    <h5 class = "article__menuCaption">Закуски</h5>
                </section>
                <section class = "article__card">
                    <img class = "article__foodPhotos" src = "image/imgSalads.png" alt = "Фото готового бургера из меню">
                    <h5 class = "article__menuCaption">Салаты</h5>
                </section>
                <section class = "article__card">
                    <img class = "article__foodPhotos" src = "image/imgDesserts.png" alt = "Фото готового бургера из меню">
                    <h5 class = "article__menuCaption">Десерты</h5>
                </section>
            </div>
        </article>

        <footer class = "footer">
            <div class = "footer__links">
                <a class = "footer__link" href = "">Программа лояльности</a>
                <a class = "footer__link" href = "">Политика конфиденциальности</a>
                <a class = "footer__link" href = "">Договор оферты</a>
            </div>
            <p class="footer__company">ООО "Vintage Food"</p>
            <p class="footer__copyright">© Все права защищены</p>
            <div class = "footer__socialNetwork">
                <img class = "footer__vk" src = "image/btnVK.png" alt = "Лого Вконтакте">
                <img class = "footer__tg" src = "image/btnTelegram.png" alt = "Лого Телеграмма">
            </div>
        </div>
    </footer>
</body>
</html>
