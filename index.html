<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vintage Food — настоящие бургеры с быстрой доставкой">
    <title>Vintage Food — бургер-кафе</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero" id="main">
        <nav class="navigation" aria-label="Основная навигация">
            <div class="navigation__inner">
                <ul class="navigation__list">
                    <li class="navigation__item">
                        <a class="navigation__link" href="#menu">Меню</a>
                    </li>
                    <li class="navigation__item">
                        <a class="navigation__link" href="#burgers">Бургеры</a>
                    </li>
                    <li class="navigation__item">
                        <a class="navigation__link" href="#snacks">Закуски</a>
                    </li>
                    <li class="navigation__item">
                        <a class="navigation__link" href="#salads">Салаты</a>
                    </li>
                    <li class="navigation__item">
                        <a class="navigation__link" href="#about">О нас</a>
                    </li>
                </ul>

                <div class="navigation__actions">
                    <a class="navigation__icon-link" href="#menu" aria-label="Поиск по меню">
                        <img class="navigation__icon navigation__icon--search" src="image/icon-search.png" alt="">
                    </a>
                    <a class="navigation__icon-link" href="#menu" aria-label="Корзина">
                        <img class="navigation__icon navigation__icon--cart" src="image/icon-cart.png" alt="">
                        <span class="navigation__counter">0</span>
                    </a>
                    <a class="button button--navigation" href="#menu">Заказать</a>
                </div>
            </div>
        </nav>

        <img class="hero__background" src="image/header.png" alt="Vintage Food. Быстрая доставка. Скидка 50 процентов на первый заказ">

        <div class="hero__content">
            <a class="button button--hero" href="#menu">
                <span>Заказать</span>
            </a>

            <div class="advantages">
                <div class="advantage">
                    <img class="advantage__icon" src="image/icon-delivery-scooter.png" alt="">
                    <p class="advantage__text">Быстрая<br>доставка</p>
                </div>

                <div class="advantage">
                    <img class="advantage__icon" src="image/icon-leaf.png" alt="">
                    <p class="advantage__text">Свежие<br>ингредиенты</p>
                </div>

                <div class="advantage">
                    <img class="advantage__icon" src="image/icon-chef-hat.png" alt="">
                    <p class="advantage__text">Любимые<br>вкусы</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="menu" id="menu">
            <div class="menu__container">
                <div class="menu__heading-row">
                    <div>
                        <p class="menu__eyebrow">НАШЕ МЕНЮ</p>
                        <h1 class="menu__title">Выберите свой вкус</h1>
                    </div>

                    <a class="menu__all-link" href="#burgers">
                        <span>Смотреть всё меню</span>
                        <span class="menu__all-arrow">→</span>
                    </a>
                </div>

                <div class="menu__grid">
                    <article class="menu-card" id="burgers">
                        <img class="menu-card__photo" src="image/menu-burgers.png" alt="Бургер с овощами и сыром">
                        <div class="menu-card__shade"></div>
                        <a class="menu-card__link" href="#burgers" aria-label="Открыть раздел Бургеры">
                            <span class="menu-card__title">Бургеры</span>
                            <span class="menu-card__arrow">→</span>
                        </a>
                    </article>

                    <article class="menu-card" id="snacks">
                        <img class="menu-card__photo" src="image/menu-snacks.png" alt="Картофель фри">
                        <div class="menu-card__shade"></div>
                        <a class="menu-card__link" href="#snacks" aria-label="Открыть раздел Закуски">
                            <span class="menu-card__title">Закуски</span>
                            <span class="menu-card__arrow">→</span>
                        </a>
                    </article>

                    <article class="menu-card" id="salads">
                        <img class="menu-card__photo" src="image/menu-salads.png" alt="Салат с курицей и свежими овощами">
                        <div class="menu-card__shade"></div>
                        <a class="menu-card__link" href="#salads" aria-label="Открыть раздел Салаты">
                            <span class="menu-card__title">Салаты</span>
                            <span class="menu-card__arrow">→</span>
                        </a>
                    </article>

                    <article class="menu-card" id="chicken">
                        <img class="menu-card__photo" src="image/menu-chicken.jpg" alt="Хрустящая курица с соусом">
                        <div class="menu-card__shade"></div>
                        <a class="menu-card__link" href="#chicken" aria-label="Открыть раздел Курица">
                            <span class="menu-card__title">Курица</span>
                            <span class="menu-card__arrow">→</span>
                        </a>
                    </article>

                    <article class="menu-card" id="hot">
                        <img class="menu-card__photo" src="image/menu-hot.jpg" alt="Стейк с запечённым картофелем и овощами">
                        <div class="menu-card__shade"></div>
                        <a class="menu-card__link" href="#hot" aria-label="Открыть раздел Горячее">
                            <span class="menu-card__title">Горячее</span>
                            <span class="menu-card__arrow">→</span>
                        </a>
                    </article>

                    <article class="menu-card" id="desserts">
                        <img class="menu-card__photo" src="image/menu-desserts.jpg" alt="Шоколадный десерт с мороженым и ягодами">
                        <div class="menu-card__shade"></div>
                        <a class="menu-card__link" href="#desserts" aria-label="Открыть раздел Десерты">
                            <span class="menu-card__title">Десерты</span>
                            <span class="menu-card__arrow">→</span>
                        </a>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" id="about">
        <p class="footer__description">Vintage Food — любимые бургеры уже у вас дома</p>
    </footer>
</body>
</html>
